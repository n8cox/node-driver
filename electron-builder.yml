appId: com.n8cox.node-driver
productName: Node Driver
copyright: Copyright © Nathan Cox

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dir
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: Node Driver
  icon: build/icon.icns

extraMetadata:
  main: electron/main.mjs

asar: true
