name: CI

on:
  push:
    branches: [main]
    paths:
      - 'examples/pulse-board/**'
      - '.github/workflows/pulse-board-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/pulse-board/**'
      - '.github/workflows/pulse-board-ci.yml'

defaults:
  run:
    working-directory: examples/pulse-board

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: examples/pulse-board/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
